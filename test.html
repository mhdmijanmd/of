<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}
.pad{height:1400px;padding:20px;box-sizing:border-box}
video{width:100%}
#fs{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);font-size:22px;padding:18px 30px;background:#00AFF0;color:#fff;border:none;border-radius:30px;z-index:9}
#pos{position:fixed;left:10px;top:10px;background:#000;padding:6px 10px;z-index:9}</style></head>
<body>
<div id=pos>scrollY: 0</div>
<div class=pad><h2>TOP</h2></div>
<div style="padding:20px"><video id=v controls playsinline
 src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video></div>
<div class=pad><h2>BOTTOM</h2></div>
<button id=fs>PLAY FULLSCREEN</button>
<script>
window.scrollTo(0,1200);
setInterval(function(){document.getElementById('pos').textContent='scrollY: '+Math.round(window.scrollY);},300);
document.getElementById('fs').onclick=function(){var v=document.getElementById('v');v.play();
 (v.requestFullscreen||v.webkitRequestFullscreen||v.webkitEnterFullscreen).call(v);};
</script></body></html>
